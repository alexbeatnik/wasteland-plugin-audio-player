# Publish the plugin, and the index that points at it.
#
# One rolling release tagged `plugins` rather than a tag per version: the app
# reads `index.json` on `main`, and that file names the exact archive and its
# checksum, so the tag is only a place to keep bytes. Archives are named with
# their version, so an update never overwrites the file an older index points
# at, and the superseded ones are taken off at the end.
#
# This repository publishes one plugin. It used to be a directory in the
# `wasteland-plugins` monorepo, where a push republished all five whatever had
# changed; here a version bump means what it says, and the release history of
# one plugin is not a log of the others.
name: Publish the plugin

on:
  push:
    branches: [main]
    paths:
      - 'plugins/**'
      - 'scripts/**'
      - '.github/workflows/release.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-audio-player
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Before anything is packed. A plugin that cannot parse a tag, or a
      # manifest that promises a file the archive does not carry, is worse than
      # one that fails to publish: it installs cleanly on somebody else's
      # machine and breaks there.
      - name: Test
        run: npm test

      - name: Pack the plugin and build the index
        run: |
          node scripts/build-index.mjs             --base-url=https://github.com/${{ github.repository }}/releases/download/plugins

      - name: Upload the archive
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Created on the first run, reused after. `--clobber` is what makes a
          # re-run of the same version replace its archive instead of failing.
          gh release view plugins >/dev/null 2>&1             || gh release create plugins --title "Plugins" --notes "Archives the app installs from. The index on main points here."
          gh release upload plugins dist/*.zip --clobber

      - name: Commit the index
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add index.json
          # Nothing to commit is the ordinary outcome of a re-run, not a failure.
          git diff --cached --quiet && echo 'index unchanged' && exit 0
          # `paths` above does not include index.json, so this push cannot
          # retrigger the workflow — the skip marker is belt and braces.
          git commit -m 'Publish plugin index [skip ci]'
          git push

      # Last, and deliberately so: between the upload above and the commit above
      # the published index still names the previous archive, and deleting it in
      # that window would break installing for as long as the window lasts.
      - name: Prune the superseded archives
        env:
          GH_TOKEN: ${{ github.token }}
          # Versions kept, newest first. The one the index names is kept whatever
          # this says, so 1 means "only what is installable".
          KEEP_VERSIONS: '1'
        run: node scripts/prune-release.mjs
